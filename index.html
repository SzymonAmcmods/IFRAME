<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulpit Główny</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <header class="border-b border-slate-700 pb-4 text-center md:text-left">
            <h1 class="text-3xl font-bold text-indigo-400">Pulpit Nawigacyjny</h1>
            <p class="text-slate-400 text-sm mt-1">Zbiór dostępnych modułów i narzędzi.</p>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <a href="ramki.html" class="group bg-slate-800 border border-slate-700 hover:border-indigo-500 rounded-xl p-6 transition-all shadow-lg flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-bold text-slate-100 group-hover:text-indigo-400 transition-colors">Pulpit Ramek</h2>
                    <p class="text-slate-400 text-sm mt-2">Podgląd na stałe osadzonych map i materiałów zewnętrznych.</p>
                </div>
                <div class="mt-6 flex items-center text-xs font-semibold text-indigo-400">
                    Otwórz moduł &rarr;
                </div>
            </a>

            <a href="zakupy.html" class="group bg-slate-800 border border-slate-700 hover:border-indigo-500 rounded-xl p-6 transition-all shadow-lg flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-bold text-slate-100 group-hover:text-indigo-400 transition-colors">Lista Zakupów & Fajek</h2>
                    <p class="text-slate-400 text-sm mt-2">Przejrzysty spis artykułów spożywczych oraz preferowanych papierosów.</p>
                </div>
                <div class="mt-6 flex items-center text-xs font-semibold text-indigo-400">
                    Otwórz moduł &rarr;
                </div>
            </a>

        </main>
    </div>

</body>
</html>
